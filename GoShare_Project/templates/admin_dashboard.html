<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoShare - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        .navbar { background: #0c1a30; color: white; display: flex; justify-content: space-between; align-items: center; padding: 14px 30px; }
        .logo { font-size: 22px; font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .badge-user { background: #78350f; padding: 6px 14px; border-radius: 20px; font-size: 14px; color: #fde68a; }
        .logout-btn { color: #ff4d4d; text-decoration: none; font-weight: bold; font-size: 14px; }
        .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }
        .banner { background: #f59e0b; color: white; text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .card-title { font-size: 20px; font-weight: bold; color: #1e293b; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .rate-form { display: flex; flex-direction: column; gap: 12px; }
        .form-group label { font-weight: bold; font-size: 14px; color: #475569; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; margin-top: 5px; }
        .btn-submit { background: #f59e0b; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #f8fafc; color: #475569; }
        .badge-role { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .role-driver { background: #dbeafe; color: #1e40af; }
        .role-passenger { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-user-shield"></i> GoShare Admin</div>
        <div class="user-info">
            <span class="badge-user"><i class="fa-solid fa-shield"></i> {{ admin.name }} (Admin)</span>
            <a href="/api/logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="banner">
            <h1>Admin Control Panel</h1>
        </div>

        <div class="card">
            <div class="card-title"><i class="fa-solid fa-sliders" style="color:#f59e0b;"></i> Per Kilometer Fare Rates (৳)</div>
            <form id="rateForm" class="rate-form">
                <div class="grid-2">
                    <div class="form-group">
                        <label>Car Rate (Per KM)</label>
                        <input type="number" id="car_rate" required>
                    </div>
                    <div class="form-group">
                        <label>Bike Rate (Per KM)</label>
                        <input type="number" id="bike_rate" required>
                    </div>
                    <div class="form-group">
                        <label>CNG Rate (Per KM)</label>
                        <input type="number" id="cng_rate" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> Save Rates</button>
            </form>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-id-card" style="color:#3b82f6;"></i> Drivers List (<span id="driver-count">0</span>)</div>
                <table>
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Phone</th></tr>
                    </thead>
                    <tbody id="drivers-table"></tbody>
                </table>
            </div>

            <div class="card">
                <div class="card-title"><i class="fa-solid fa-users" style="color:#10b981;"></i> Passengers List (<span id="passenger-count">0</span>)</div>
                <table>
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Phone</th></tr>
                    </thead>
                    <tbody id="passengers-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadRates() {
            const res = await fetch('/api/admin/rates');
            const data = await res.json();
            if(data.status === 'success') {
                document.getElementById('car_rate').value = data.rates.car;
                document.getElementById('bike_rate').value = data.rates.bike;
                document.getElementById('cng_rate').value = data.rates.cng;
            }
        }

        document.getElementById('rateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/admin/rates', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    car: document.getElementById('car_rate').value,
                    bike: document.getElementById('bike_rate').value,
                    cng: document.getElementById('cng_rate').value
                })
            });
            const data = await res.json();
            alert(data.message);
        });

        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            if(data.status === 'success') {
                const driversTable = document.getElementById('drivers-table');
                const passengersTable = document.getElementById('passengers-table');
                driversTable.innerHTML = '';
                passengersTable.innerHTML = '';

                let driverCount = 0;
                let passengerCount = 0;

                data.users.forEach(u => {
                    if(u.Role === 'Driver') {
                        driverCount++;
                        driversTable.innerHTML += `<tr><td>${u.FullName}</td><td>${u.Email}</td><td>${u.Phone || 'N/A'}</td></tr>`;
                    } else if(u.Role === 'Passenger') {
                        passengerCount++;
                        passengersTable.innerHTML += `<tr><td>${u.FullName}</td><td>${u.Email}</td><td>${u.Phone || 'N/A'}</td></tr>`;
                    }
                });

                document.getElementById('driver-count').innerText = driverCount;
                document.getElementById('passenger-count').innerText = passengerCount;
            }
        }

        loadRates();
        loadUsers();
    </script>
</body>
</html>
