<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoShare - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0c1a30; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .login-card { background: #ffffff; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; color: #0c1a30; margin-bottom: 25px; font-size: 24px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: #0088cc; box-shadow: 0 0 5px rgba(0, 136, 204, 0.3); }

        .btn-login { width: 100%; background: #0088cc; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #006699; }

        .footer-text { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .footer-text a { color: #0088cc; text-decoration: none; font-weight: bold; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2><i class="fa-solid fa-car" style="color: #0088cc;"></i> GoShare Login</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="enter your password" required>
            </div>

            <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.status === 'success') {
                    alert(data.message);
                    // রোল অনুযায়ী ব্যাকএন্ড থেকে আসা Redirect URL এ পাঠানো হবে
                    window.location.href = data.redirect || '/dashboard';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.error(err);
                alert('লগইন করার সময় একটি সমস্যা হয়েছে!');
            }
        });
    </script>

</body>
</html>
