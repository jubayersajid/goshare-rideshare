<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoShare - Driver Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }

        .navbar { background: #0c1a30; color: white; display: flex; justify-content: space-between; align-items: center; padding: 14px 30px; }
        .logo { font-size: 22px; font-weight: bold; color: #0088cc; display: flex; align-items: center; gap: 8px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .badge-user { background: #233554; padding: 6px 14px; border-radius: 20px; font-size: 14px; }
        .logout-btn { color: #ff4d4d; text-decoration: none; font-weight: bold; font-size: 14px; }

        .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }
        
        .card-title { font-size: 20px; font-weight: bold; color: #1e293b; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        .rides-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .ride-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; position: relative; }
        
        .ride-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed #cbd5e1; }
        .ride-id { font-size: 13px; font-weight: bold; color: #64748b; }
        .fare-price { font-size: 18px; font-weight: bold; color: #0088cc; }

        .info-group { font-size: 14px; line-height: 1.8; color: #334155; margin-bottom: 15px; }
        .info-group i { width: 20px; text-align: center; margin-right: 6px; }

        .status-tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        .status-requested { background: #fef08a; color: #854d0e; }
        .status-accepted { background: #bfdbfe; color: #1e40af; }
        .status-completed { background: #bbf7d0; color: #166534; }
        .status-cancelled { background: #fecdd3; color: #9f1239; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
        .btn-accept { background: #22c55e; color: white; }
        .btn-remove { background: #ef4444; color: white; }
        .btn-complete { background: #3b82f6; color: white; }
        .btn-cancel { background: #dc2626; color: white; }

        .empty-rides { text-align: center; padding: 40px; background: white; border-radius: 12px; color: #64748b; font-size: 15px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-car-side"></i> GoShare Driver</div>
        <div class="user-info">
            <span class="badge-user"><i class="fa-solid fa-id-card"></i> {{ driver.name }}</span>
            <a href="/api/logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="card-title"><i class="fa-solid fa-list-check" style="color:#0088cc;"></i> Available Ride Requests</div>
        <div class="rides-grid" id="driver-rides-container">
            <div class="empty-rides">Loading requests...</div>
        </div>
    </div>

    <script>
        function getRemovedRides() {
            return JSON.parse(localStorage.getItem('removed_rides') || '[]');
        }

        function removeCardLocally(rideId) {
            let removed = getRemovedRides();
            if (!removed.includes(rideId)) {
                removed.push(rideId);
                localStorage.setItem('removed_rides', JSON.stringify(removed));
            }
            fetchAvailableRides();
        }

        async function fetchAvailableRides() {
            try {
                const res = await fetch('/api/driver/available-rides');
                const rides = await res.json();
                const container = document.getElementById('driver-rides-container');
                container.innerHTML = '';

                const removedRides = getRemovedRides();
                const activeRides = rides.filter(r => !removedRides.includes(r.ride_id));

                if (activeRides.length === 0) {
                    container.innerHTML = '<div class="empty-rides">বর্তমানে কোনো রাইড রিকোয়েস্ট খালি নেই</div>';
                    return;
                }

                activeRides.forEach(r => {
                    let badgeClass = 'status-' + r.status.toLowerCase();
                    let actionButtons = '';

                    if (r.status === 'Requested') {
                        actionButtons = `
                            <div class="btn-group">
                                <button class="btn btn-accept" onclick="updateRideStatus(${r.ride_id}, 'Accepted')"><i class="fa-solid fa-check"></i> Accept</button>
                                <button class="btn btn-remove" onclick="removeCardLocally(${r.ride_id})"><i class="fa-solid fa-trash"></i> Remove</button>
                            </div>
                        `;
                    } 
                    else if (r.status === 'Accepted') {
                        actionButtons = `
                            <div class="btn-group">
                                <button class="btn btn-complete" onclick="updateRideStatus(${r.ride_id}, 'Completed')"><i class="fa-solid fa-flag-checkered"></i> Complete</button>
                                <button class="btn btn-cancel" onclick="updateRideStatus(${r.ride_id}, 'Cancelled')"><i class="fa-solid fa-ban"></i> Cancel</button>
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="ride-card" id="ride-card-${r.ride_id}">
                            <div class="ride-header">
                                <span class="ride-id">Ride #${r.ride_id} (${r.vehicle})</span>
                                <span class="fare-price">৳${r.fare}</span>
                            </div>
                            <span class="status-tag ${badgeClass}">${r.status}</span>
                            <div class="info-group">
                                <div><i class="fa-solid fa-user" style="color:#6366f1;"></i> <strong>Passenger:</strong> ${r.passenger_name}</div>
                                <div><i class="fa-solid fa-phone" style="color:#0088cc;"></i> <strong>Phone:</strong> <a href="tel:${r.passenger_phone}">${r.passenger_phone}</a></div>
                                <div><i class="fa-solid fa-circle-dot" style="color:#22c55e;"></i> <strong>From:</strong> ${r.pickup}</div>
                                <div><i class="fa-solid fa-location-dot" style="color:#ef4444;"></i> <strong>To:</strong> ${r.dropoff}</div>
                                <div><i class="fa-solid fa-road" style="color:#64748b;"></i> <strong>Distance:</strong> ${r.distance} km</div>
                            </div>
                            ${actionButtons}
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function updateRideStatus(rideId, status) {
            let confirmMsg = status === 'Cancelled' ? 'আপনি কি রাইডটি বাতিল করতে চান?' : `আপনি কি রাইডটি ${status} করতে চান?`;
            
            if (!confirm(confirmMsg)) return;

            try {
                const res = await fetch('/api/driver/update-ride', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ride_id: rideId, status: status })
                });

                const data = await res.json();
                
                if (data.status === 'success') {
                    alert(`🔔 ${data.message}`);
                    fetchAvailableRides();
                } else {
                    alert('ত্রুটি: ' + data.message);
                }
            } catch (err) {
                alert('অনুরোধটি ব্যর্থ হয়েছে, আবার চেষ্টা করুন!');
            }
        }

        fetchAvailableRides();
        setInterval(fetchAvailableRides, 5000);
    </script>
</body>
</html>
