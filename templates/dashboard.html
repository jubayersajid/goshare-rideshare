<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoShare - Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }

        .navbar { background: #0c1a30; color: white; display: flex; justify-content: space-between; align-items: center; padding: 14px 30px; }
        .logo { font-size: 22px; font-weight: bold; color: #0088cc; display: flex; align-items: center; gap: 8px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .badge-user { background: #233554; padding: 6px 14px; border-radius: 20px; font-size: 14px; }
        .logout-btn { color: #ff4d4d; text-decoration: none; font-weight: bold; font-size: 14px; }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }

        .banner { background: #0088cc; color: white; text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .banner h1 { font-size: 26px; }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        
        .swap-btn { display: flex; justify-content: center; margin: 5px 0; }
        .swap-btn button { background: #0088cc; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; }

        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        .est-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px; display: flex; justify-content: space-around; text-align: center; margin: 15px 0; }
        .est-item span { display: block; font-size: 11px; color: #166534; font-weight: bold; }
        .est-item strong { font-size: 16px; color: #15803d; }

        .btn-book { width: 100%; background: #0088cc; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        #map { height: 350px; border-radius: 8px; width: 100%; }

        /* New Ride History Section */
        .history-section { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; margin-top: 15px; }
        
        .ride-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; background: #fafafa; position: relative; }
        .ride-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #cbd5e1; }
        .ride-id { font-size: 12px; font-weight: bold; color: #64748b; }
        
        .status-tag { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .status-requested { background: #fef08a; color: #854d0e; }
        .status-completed { background: #bbf7d0; color: #166534; }
        .status-cancelled { background: #fecdd3; color: #9f1239; }

        .route-info { font-size: 13px; line-height: 1.6; color: #334155; }
        .route-info i { width: 18px; text-align: center; margin-right: 5px; }
        .fare-price { font-size: 18px; font-weight: bold; color: #0088cc; text-align: right; margin-top: 8px; }
        .empty-history { text-align: center; padding: 30px; color: #64748b; font-size: 14px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-car"></i> GoShare</div>
        <div class="user-info">
            <span class="badge-user"><i class="fa-solid fa-user"></i> {{ user.name }}</span>
            <a href="/api/logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="banner">
            <h1>Book Your Ride in Seconds</h1>
        </div>

        <div class="grid-container">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-route" style="color:#0088cc;"></i> Ride Booking</div>
                
                <div class="form-group">
                    <label>Pickup Location</label>
                    <input type="text" id="pickup" value="Dhanmondi, Dhaka" onchange="updateRoute()">
                </div>

                <div class="swap-btn">
                    <button onclick="swapLocations()"><i class="fa-solid fa-arrow-down-up-across-line"></i></button>
                </div>

                <div class="form-group">
                    <label>Destination Location</label>
                    <input type="text" id="dropoff" value="Uttara, Dhaka" onchange="updateRoute()">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Road Distance (km)</label>
                        <input type="number" id="distance" value="0" readonly>
                    </div>
                    <div class="form-group">
                        <label>Vehicle Type</label>
                        <select id="vehicle_type" onchange="calculateFare()">
                            <option value="Car">Car</option>
                            <option value="Bike">Bike</option>
                            <option value="CNG">CNG</option>
                        </select>
                    </div>
                </div>

                <div class="est-box">
                    <div class="est-item">
                        <span>Road Distance</span>
                        <strong id="disp-dist">0 km</strong>
                    </div>
                    <div class="est-item">
                        <span>Est. Fare</span>
                        <strong id="disp-fare">৳0</strong>
                    </div>
                    <div class="est-item">
                        <span>Est. Time (ETA)</span>
                        <strong id="disp-time">0 মিনিট</strong>
                    </div>
                </div>

                <button class="btn-book" onclick="submitRide()"><i class="fa-solid fa-paper-plane"></i> Book Ride</button>
            </div>

            <div class="card">
                <div id="map"></div>
            </div>
        </div>

        <!-- Updated Ride History Component -->
        <div class="history-section">
            <div class="card-title"><i class="fa-solid fa-clock-rotate-left" style="color:#0088cc;"></i> Ride History & Status</div>
            <div class="history-grid" id="history-container">
                <div class="empty-history">Loading history...</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([23.8103, 90.4125], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        let pickupMarker, dropoffMarker, routePolyline;

        async function getCoordinates(query) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
                }
            } catch (err) { console.error(err); }
            return null;
        }

        async function updateRoute() {
            const pickup = document.getElementById('pickup').value;
            const dropoff = document.getElementById('dropoff').value;

            if (!pickup || !dropoff) return;

            const pCoords = await getCoordinates(pickup);
            const dCoords = await getCoordinates(dropoff);

            if (pCoords && dCoords) {
                if (pickupMarker) map.removeLayer(pickupMarker);
                if (dropoffMarker) map.removeLayer(dropoffMarker);
                if (routePolyline) map.removeLayer(routePolyline);

                pickupMarker = L.marker([pCoords.lat, pCoords.lon]).addTo(map).bindPopup('Pickup Location').openPopup();
                dropoffMarker = L.marker([dCoords.lat, dCoords.lon]).addTo(map).bindPopup('Destination');

                const routeUrl = `https://router.project-osrm.org/route/v1/driving/${pCoords.lon},${pCoords.lat};${dCoords.lon},${dCoords.lat}?overview=full&geometries=geojson`;

                try {
                    const response = await fetch(routeUrl);
                    const routeData = await response.json();

                    if (routeData.routes && routeData.routes.length > 0) {
                        const route = routeData.routes[0];
                        const distanceInKm = (route.distance / 1000).toFixed(1);
                        
                        const routeCoordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
                        routePolyline = L.polyline(routeCoordinates, { color: '#0088cc', weight: 5, opacity: 0.8 }).addTo(map);

                        map.fitBounds(routePolyline.getBounds(), { padding: [30, 30] });
                        document.getElementById('distance').value = distanceInKm;
                        calculateFare();
                    }
                } catch (err) { console.error(err); }
            }
        }

        function swapLocations() {
            let p = document.getElementById('pickup').value;
            let d = document.getElementById('dropoff').value;
            document.getElementById('pickup').value = d;
            document.getElementById('dropoff').value = p;
            updateRoute();
        }

        function calculateFare() {
            let dist = parseFloat(document.getElementById('distance').value) || 0;
            let type = document.getElementById('vehicle_type').value;
            let rate = type === 'Car' ? 30 : (type === 'Bike' ? 15 : 20);
            
            let totalFare = Math.round(dist * rate);
            let estTime = Math.round(dist * 2.5);

            document.getElementById('disp-dist').innerText = dist + ' km';
            document.getElementById('disp-fare').innerText = '৳' + totalFare;
            document.getElementById('disp-time').innerText = estTime + ' মিনিট';
        }

        async function submitRide() {
            const pickup = document.getElementById('pickup').value;
            const dropoff = document.getElementById('dropoff').value;
            const distance = document.getElementById('distance').value;
            const vehicle_type = document.getElementById('vehicle_type').value;

            if(!pickup || !dropoff || distance == 0) {
                alert("দয়া করে Pickup ও Destination নির্বাচন করুন!");
                return;
            }

            const res = await fetch('/api/book-ride', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pickup, dropoff, distance, vehicle_type })
            });

            const data = await res.json();
            alert(data.message);
            loadHistory();
        }

        async function loadHistory() {
            const res = await fetch('/api/ride-history');
            const rides = await res.json();
            const container = document.getElementById('history-container');
            container.innerHTML = '';

            if (rides.length === 0) {
                container.innerHTML = '<div class="empty-history">কোনো রাইড হিস্ট্রি পাওয়া যায়নি</div>';
                return;
            }

            rides.forEach((r) => {
                let badgeClass = r.status === 'requested' ? 'status-requested' : (r.status === 'completed' ? 'status-completed' : 'status-cancelled');
                
                // ড্রাইভারের ফোন নম্বর ডিসপ্লে করার ব্যাকআপ ফিল্টার
                let driverPhone = r.partner_phone || r.driver_phone || r.phone;
                let driverDisplay = r.partner_name || 'N/A';
                
                if (driverPhone) {
                    driverDisplay += ` (${driverPhone}) <a href="tel:${driverPhone}" style="color:#0088cc; margin-left:4px;"><i class="fa-solid fa-phone"></i></a>`;
                }

                container.innerHTML += `
                    <div class="ride-card">
                        <div class="ride-header">
                            <span class="ride-id">Ride #${r.ride_id} (${r.vehicle})</span>
                            <span class="status-tag ${badgeClass}">${r.status}</span>
                        </div>
                        <div class="route-info">
                            <div><i class="fa-solid fa-circle-dot" style="color:#22c55e;"></i> <strong>From:</strong> ${r.pickup}</div>
                            <div><i class="fa-solid fa-location-dot" style="color:#ef4444;"></i> <strong>To:</strong> ${r.dropoff}</div>
                            <div><i class="fa-solid fa-user-gear" style="color:#6366f1;"></i> <strong>Driver:</strong> ${driverDisplay}</div>
                            <div><i class="fa-solid fa-calendar-days" style="color:#64748b;"></i> ${r.date}</div>
                        </div>
                        <div class="fare-price">৳${r.fare}</div>
                    </div>
                `;
            });
        }

        updateRoute();
        loadHistory();
    </script>
</body>
</html>
